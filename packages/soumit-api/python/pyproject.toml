[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soumit"
version = "1.1.0"
description = "Official Python client for Soumit (https://soumit.ma) — Moroccan Public Procurement Intelligence Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "VEXT AI", email = "contact@vext.ma" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://vext.ma"
Documentation = "https://vext.ma/docs/soumit-api"
Repository = "https://github.com/vext-ma/soumit-api"
